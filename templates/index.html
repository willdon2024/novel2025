<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI小说生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">AI小说生成器</h1>
        
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
            <div class="mb-6">
                <label for="title" class="block text-gray-700 text-sm font-bold mb-2">输入小说标题</label>
                <input type="text" id="title" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入小说标题...">
            </div>
            
            <button onclick="generateNovel()" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200">
                生成小说
            </button>

            <div id="loading" class="hidden mt-4 text-center text-gray-600">
                正在生成小说，请稍候...
            </div>

            <div id="result" class="mt-6">
                <div id="novel-content" class="prose max-w-none"></div>
            </div>
        </div>
    </div>

    <script>
        async function generateNovel() {
            const title = document.getElementById('title').value;
            if (!title) {
                alert('请输入小说标题');
                return;
            }

            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('novel-content');
            
            loading.classList.remove('hidden');
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/generate_novel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title }),
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                resultDiv.innerHTML = data.content.split('\n').map(para => 
                    `<p class="mb-4">${para}</p>`
                ).join('');
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-500">错误：${error.message}</p>`;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
